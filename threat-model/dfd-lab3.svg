  <rect x="35" y="150" width="250" height="100" fill="#fff" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="160" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">E1 - Estacion Red Team</text>
  <text x="160" y="198" font-size="11.5" text-anchor="middle" fill="#444">Kali / contenedor redteam</text>
  <text x="160" y="216" font-size="11.5" text-anchor="middle" fill="#444">172.28.0.30</text>
  <text x="160" y="238" font-size="11" text-anchor="middle" fill="#777">nmap - curl - ZAP pasivo</text>

