    <rect x="625"  y="788" width="180" height="25" fill="#fff" stroke="#c0392b" rx="4"/>
    <text x="715"  y="805" text-anchor="middle">TB2  red -&gt; aplicacion</text>
    <rect x="1088" y="333" width="172" height="25" fill="#fff" stroke="#c0392b" rx="4"/>
    <text x="1174" y="350" text-anchor="middle">TB3  proceso -&gt; datos</text>
  </g>

