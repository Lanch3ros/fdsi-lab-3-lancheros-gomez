  <line x1="44" y1="598" x2="70" y2="598" stroke="#333" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="80" y="602" font-size="10.5" fill="#333">Flujo de respuesta</text>
  <line x1="44" y1="622" x2="70" y2="622" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="80" y="626" font-size="10.5" fill="#333">Flujo visible para Blue Team</text>
  <text x="44" y="652" font-size="10.5" fill="#a03028">D1-D10 = debilidades de la linea base.</text>
  <text x="44" y="668" font-size="10.5" fill="#a03028">Detalle en threat-model/stride.md</text>

  <text x="24" y="878" font-size="11" fill="#777">Uso academico autorizado. Ningun activo, IP, usuario, hash o alerta representado corresponde a un sistema real.</text>
