  <rect x="595" y="119" width="168" height="18" fill="#fff" rx="3"/>
  <text x="679" y="132" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#a03028">F3 - proxy interno :8000</text>
  <line x1="617" y1="185" x2="743" y2="185" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>

  <line x1="480" y1="279" x2="480" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="492" y="318" font-size="11.5" font-weight="bold" fill="#111">F4</text>

  <path d="M 655 279 L 655 562 L 619 562" fill="none" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="662" y="300" font-size="11.5" font-weight="bold" fill="#1a5fa8">F5</text>
  <text x="662" y="315" font-size="9.5" fill="#1a5fa8">escribe</text>

  <line x1="480" y1="612" x2="480" y2="653" stroke="#1a5fa8" stroke-width="2" marker-end="url(#arB)"/>
  <text x="492" y="638" font-size="11.5" font-weight="bold" fill="#1a5fa8">F6</text>

  <line x1="860" y1="279" x2="860" y2="376" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="872" y="318" font-size="11.5" font-weight="bold" fill="#111">F7</text>

  <path d="M 1080 279 L 1080 567 L 1039 567" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <text x="1088" y="300" font-size="11.5" font-weight="bold" fill="#111">F8</text>
  <text x="1088" y="315" font-size="9.5" fill="#555">escribe</text>

  <!-- LEYENDA -->
  <rect x="30" y="425" width="258" height="255" fill="#fff" stroke="#bbb" rx="6"/>
  <text x="44" y="448" font-size="12.5" font-weight="bold" fill="#111">Leyenda</text>
  <rect x="44" y="462" width="26" height="16" fill="#fff" stroke="#c0392b" stroke-width="2" rx="3"/>
  <text x="80" y="475" font-size="10.5" fill="#333">Entidad externa (no confiable)</text>
  <rect x="44" y="490" width="26" height="16" fill="#fff" stroke="#1a5fa8" stroke-width="2" rx="8"/>
