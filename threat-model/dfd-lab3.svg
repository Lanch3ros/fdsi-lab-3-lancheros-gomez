  <text x="890" y="557" font-size="11" text-anchor="middle" fill="#444">acciones del Incident Hub</text>
  <text x="890" y="578" font-size="10.5" text-anchor="middle" fill="#a03028">D9 sin hora ni correlacion</text>
  <text x="890" y="596" font-size="10.5" text-anchor="middle" fill="#a03028">origen declarado por el cliente</text>
  <text x="890" y="612" font-size="10.5" text-anchor="middle" fill="#777">publico en GET /api/v1/audit</text>

