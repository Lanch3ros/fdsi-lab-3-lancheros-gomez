  <rect x="345" y="150" width="270" height="125" fill="#fff" stroke="#1a5fa8" stroke-width="2.5" rx="26"/>
  <text x="480" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">P1 - Nginx</text>
  <text x="480" y="197" font-size="11" text-anchor="middle" fill="#444">estatico + proxy inverso</text>
  <text x="480" y="215" font-size="11" text-anchor="middle" fill="#444">172.28.0.10 : 80/TCP</text>
  <text x="480" y="238" font-size="10.5" text-anchor="middle" fill="#a03028">D1 banner - D2 autoindex</text>
  <text x="480" y="253" font-size="10.5" text-anchor="middle" fill="#a03028">D3 sin headers - D4 rutas ocultas</text>
  <text x="480" y="268" font-size="10.5" text-anchor="middle" fill="#a03028">D5 sin limite - D10 sin X-Real-IP</text>

