  <rect x="745" y="150" width="290" height="125" fill="#fff" stroke="#1d7a33" stroke-width="2.5" rx="26"/>
  <text x="890" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">P2 - Incident Hub API</text>
  <text x="890" y="197" font-size="11" text-anchor="middle" fill="#444">Flask / gunicorn</text>
  <text x="890" y="215" font-size="11" text-anchor="middle" fill="#444">172.28.0.20 : 8000/TCP</text>
  <text x="890" y="238" font-size="10.5" text-anchor="middle" fill="#a03028">D7 exposicion excesiva - D8 /debug</text>
  <text x="890" y="253" font-size="10.5" text-anchor="middle" fill="#a03028">sin autenticacion ni autorizacion</text>
  <text x="890" y="268" font-size="10.5" text-anchor="middle" fill="#a03028">confia en X-Forwarded-For</text>

