  <text x="24" y="58" font-size="12.5" fill="#555">FDSI Laboratorio 3 | Grupos G03+G04 | Linea base: HTTP sin autenticacion | Datos 100% ficticios</text>

  <!-- ZONAS -->
  <rect x="20"  y="80" width="280" height="760" fill="#fdf1f0" stroke="#e0c6c3" rx="8"/>
  <rect x="330" y="80" width="370" height="760" fill="#f2f6fb" stroke="#c7d5e3" rx="8"/>
  <rect x="730" y="80" width="535" height="760" fill="#f3faf4" stroke="#c6dfcb" rx="8"/>
  <text x="34"  y="104" font-size="12.5" font-weight="bold" fill="#a03028">ZONA NO CONFIABLE</text>
  <text x="344" y="104" font-size="12.5" font-weight="bold" fill="#1a5fa8">HOST - CAPA DE RED</text>
  <text x="744" y="104" font-size="12.5" font-weight="bold" fill="#1d7a33">CAPA DE APLICACION</text>

  <!-- FRONTERAS DE CONFIANZA -->
  <line x1="315"  y1="80"  x2="315"  y2="840" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="10 6"/>
  <line x1="715"  y1="80"  x2="715"  y2="840" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="10 6"/>
  <line x1="330"  y1="345" x2="1265" y2="345" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="344" y="369" font-size="10.5" fill="#888">almacenamiento</text>
  <text x="744" y="369" font-size="10.5" fill="#888">almacenamiento</text>

