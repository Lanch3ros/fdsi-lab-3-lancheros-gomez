  <rect x="345" y="655" width="270" height="90" fill="#fff" stroke="#1a5fa8" stroke-width="2" stroke-dasharray="6 3" rx="4"/>
  <text x="480" y="682" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">E3 - Blue Team</text>
  <text x="480" y="703" font-size="11" text-anchor="middle" fill="#444">tcpdump - analisis de logs</text>
  <text x="480" y="725" font-size="10.5" text-anchor="middle" fill="#777">Jeyder Leon (opera en el host)</text>

  <!-- DS3 ALERTS -->
  <rect x="745" y="380" width="290" height="105" fill="#fff" stroke="#1d7a33" stroke-width="2" rx="4"/>
  <line x1="745" y1="402" x2="1035" y2="402" stroke="#1d7a33" stroke-width="1.5"/>
  <text x="890" y="397" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">DS3 - Dataset de alertas</text>
  <text x="890" y="422" font-size="11" text-anchor="middle" fill="#444">alerts.json - 5 alertas ficticias</text>
  <text x="890" y="441" font-size="11" text-anchor="middle" fill="#444">cmdline - user_name - sha256</text>
  <text x="890" y="460" font-size="11" text-anchor="middle" fill="#444">hostnames e IP internas simuladas</text>
  <text x="890" y="477" font-size="10.5" text-anchor="middle" fill="#777">datos simulados de Falcon</text>

  <!-- DS4 AUDIT -->
  <rect x="745" y="515" width="290" height="105" fill="#fff" stroke="#1d7a33" stroke-width="2" rx="4"/>
  <line x1="745" y1="537" x2="1035" y2="537" stroke="#1d7a33" stroke-width="1.5"/>
