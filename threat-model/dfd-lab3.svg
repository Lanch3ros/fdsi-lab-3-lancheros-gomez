  <line x1="285" y1="185" x2="343" y2="185" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="343" y1="222" x2="285" y2="222" stroke="#333" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <rect x="249" y="252" width="133" height="34" fill="#fff" stroke="#1a5fa8" rx="5"/>
