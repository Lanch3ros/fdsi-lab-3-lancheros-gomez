  <text x="480" y="557" font-size="11" text-anchor="middle" fill="#444">access.log (combined) - error.log</text>
  <text x="480" y="576" font-size="10.5" text-anchor="middle" fill="#777">IP - fecha - metodo - ruta</text>
  <text x="480" y="594" font-size="10.5" text-anchor="middle" fill="#777">codigo - bytes - User-Agent</text>

