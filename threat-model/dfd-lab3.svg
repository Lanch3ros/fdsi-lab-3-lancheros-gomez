  <rect x="345" y="380" width="270" height="95" fill="#fff" stroke="#1a5fa8" stroke-width="2" rx="4"/>
  <line x1="345" y1="402" x2="615" y2="402" stroke="#1a5fa8" stroke-width="1.5"/>
