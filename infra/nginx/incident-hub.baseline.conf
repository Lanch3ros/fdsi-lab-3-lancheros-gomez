# ============================================================================
# CrowdStrike Incident Hub - Nginx - ESTADO "ANTES" (linea base insegura)
# FDSI Laboratorio 3 - Grupo G04
#
# Esta configuracion es intencionalmente debil. Corresponde al Paso 4 de la
# guia y es el objetivo autorizado del Red Team. NO usar fuera del laboratorio.
#
# Debilidades presentes (documentadas, no accidentales):
#   D1  server_tokens on (por defecto) -> revela version de Nginx en banner
#   D2  autoindex on -> permite enumerar el contenido de /files/
#   D3  sin X-Content-Type-Options / X-Frame-Options / Referrer-Policy
#   D4  rutas ocultas (.git, .env) servidas sin restriccion
#   D5  sin limite de tasa: la enumeracion no encuentra friccion
#   D6  todo por HTTP: sin confidencialidad ni integridad en transito
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/incident-hub;
    index index.html;

    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    # D2: listado de directorio habilitado
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # API del Incident Hub (Flask/gunicorn)
    location /api/ {
        proxy_pass http://incident-hub-api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
