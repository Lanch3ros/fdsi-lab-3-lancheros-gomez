# ============================================================================
# CrowdStrike Incident Hub - Nginx - ESTADO "DESPUES" (hardening Paso 15)
# FDSI Laboratorio 3 - Grupos G03+G04 (fusionados)
#
# Correcciones aplicadas respecto a incident-hub.baseline.conf:
#   C1 (corrige D1) server_tokens off      -> el banner ya no revela version
#   C2 (corrige D2) autoindex off          -> no se puede enumerar /files/
#   C3 (corrige D3) headers de seguridad   -> nosniff, DENY, no-referrer
#   C4 (corrige D4) location ~ /\.         -> rutas ocultas devuelven 404
#   C5 (mitiga  D5) limit_req              -> frena la enumeracion automatizada
#
# LIMITE PEDAGOGICO EXPLICITO: el servicio sigue publicado por HTTP. D6
# (ausencia de confidencialidad e integridad en transito) NO se corrige aqui;
# queda registrada como riesgo ACEPTADO y se traslada al Laboratorio 4 junto
# con certificados, identidad, sesiones y roles.
# ============================================================================

# C5: zona de limite de tasa (10 req/s por IP, rafaga de 20).
limit_req_zone $binary_remote_addr zone=hub_rl:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/incident-hub;
    index index.html;

    access_log /var/log/nginx/lab3_access.log combined;
    error_log  /var/log/nginx/lab3_error.log  warn;

    # C1 / C2
    server_tokens off;
    autoindex off;

    # C3: se aplican tambien a respuestas de error (always)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # C4: bloquea .git, .env, .ssh y cualquier ruta oculta.
    # Se responde 404 en lugar de 403 para no confirmar la existencia del recurso.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=hub_rl burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=hub_rl burst=20 nodelay;
        proxy_pass http://incident-hub-api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }
}
