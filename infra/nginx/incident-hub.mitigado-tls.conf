# ============================================================================
# CrowdStrike Incident Hub - Nginx - CAPA DE MITIGACION (Fase 2)
# FDSI Laboratorio 3 - Grupos G03+G04
#
# Este es el estado de mitigacion COMPLETA. Suma, sobre el hardening HTTP:
#   M-TLS: terminacion TLS (HTTPS) con certificado del laboratorio.
#          Corrige D6 en su raiz -> el contenido deja de viajar en claro.
#          Es la mitigacion que se VALIDA en Wireshark: el "Follow HTTP Stream"
#          ya no muestra JSON legible, sino datos cifrados (TLS Application Data).
#   M-HSTS: Strict-Transport-Security -> el navegador exige HTTPS en el futuro.
#   M-REDIR: todo el trafico HTTP :80 se redirige a HTTPS :443 (Tampering H4).
#
# NOTA PEDAGOGICA: la guia del Lab 3 dejaba TLS como riesgo aceptado para el
# Lab 4. Esta capa lo adelanta a peticion del ejercicio de mitigacion, y por eso
# vive en un archivo aparte, activable con TLS=1 sin alterar los estados
# HARDENED=0/1 que documentan el antes/despues del Lab 3.
# ============================================================================

# M-DoS (D5): limite de tasa contra enumeracion automatizada.
limit_req_zone $binary_remote_addr zone=hub_rl_tls:10m rate=10r/s;

# M-REDIR (H4/D6): todo HTTP se manda a HTTPS. No se sirve contenido por :80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/lab3_access.log combined;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    http2 on;

    # M-TLS: certificado del laboratorio (autofirmado, generado en el build).
    ssl_certificate     /etc/nginx/certs/incident-hub.crt;
    ssl_certificate_key /etc/nginx/certs/incident-hub.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/incident-hub;
    index index.html;

    access_log /var/log/nginx/lab3_access.log combined;
    error_log  /var/log/nginx/lab3_error.log  warn;

    # Hardening HTTP heredado del estado HARDENED=1 (C1..C5):
    server_tokens off;                                            # C1 / D1
    autoindex off;                                                # C2 / D2
    add_header X-Content-Type-Options "nosniff"    always;        # C3 / D3
    add_header X-Frame-Options        "DENY"       always;        # C3 / D3
    add_header Referrer-Policy        "no-referrer" always;       # C3 / D3

    # M-HSTS: exige HTTPS en visitas futuras (solo tiene sentido ya con TLS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # C4 / D4: rutas ocultas (.git, .env) -> 404.
    location ~ /\. { deny all; return 404; }

    location / {
        limit_req zone=hub_rl_tls burst=20 nodelay;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=hub_rl_tls burst=20 nodelay;
        proxy_pass http://incident-hub-api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;          # M-Spoof / D10
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;                           # C1 / D1
    }
}
